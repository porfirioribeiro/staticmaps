packages:
  - packages/**
  - '!**/test/**'
  - '!**/dist/**'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  '@vitest/coverage-v8': 5.0.5
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowedVersions:
    vite: '*'
    vitest: '*'
